{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block page_title %}Iniciar sesión | Voltio Tech{% endblock %}

{% block content %}

<section class="content-surface mx-auto" style="max-width: 460px;">
    <h2 class="h4 mb-4">Acceso al gestor</h2>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <label for="username" class="form-label">Usuario</label>
        <input id="username" type="text" name="username" class="form-control mb-3" autocomplete="username" required>
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" type="password" name="password" class="form-control mb-4" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
</section>

{% endblock %}
